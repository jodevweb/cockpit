# Vérifications à chaque push et pull request, sur les deux systèmes que le
# cockpit sert : macOS et Windows.
#
# Les actions sont épinglées par empreinte de commit, pas par tag : un tag se
# déplace, un commit non. La version lisible est en commentaire.

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash sous Windows : c'est aussi le shell que le cockpit utilise
        # pour tout ce qu'il lance, et les tests le supposent présent.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Dépendances
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm exec tsc --noEmit

      - name: Catalogues de traduction
        run: node scripts/i18n-check.mjs

      # `generate_context!` embarque `frontendDist` à la compilation : sans
      # `dist/`, même les tests Rust refusent de compiler.
      - name: Interface
        run: pnpm exec vite build

      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test --lib

  # Un installeur Windows à essayer, sans rien publier : ni signature de mise à
  # jour, ni release. Sur la branche `windows` et à la demande seulement — une
  # compilation de production coûte une vingtaine de minutes.
  installeur-windows:
    name: Installeur Windows (test)
    if: github.ref == 'refs/heads/windows' || github.event_name == 'workflow_dispatch'
    needs: verifier
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Dépendances
        run: pnpm install --frozen-lockfile

      - name: Installeur NSIS
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cockpit-windows-installeur
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
