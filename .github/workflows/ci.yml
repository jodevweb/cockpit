# Vérifications à chaque push et pull request, sur les deux systèmes que le
# cockpit sert : macOS et Windows.
#
# Les actions sont épinglées par empreinte de commit, pas par tag : un tag se
# déplace, un commit non. La version lisible est en commentaire.

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash sous Windows : c'est aussi le shell que le cockpit utilise
        # pour tout ce qu'il lance, et les tests le supposent présent.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      # OpenSSL se compile avec l'app, et son script de configuration veut un
      # Perl complet : sous Windows, celui de Git Bash n'a pas tous ses modules.
      # Strawberry Perl est installé sur les machines Windows de GitHub. Posée
      # ici et non pour tout le workflow : sur macOS, ce chemin n'existe pas.
      - name: Perl pour OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"

      # Les bibliothèques que Tauri lie sous Linux : WebKitGTK et ses voisines.
      - name: Bibliothèques système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev patchelf

      - name: Dépendances
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm lint

      - name: Catalogues de traduction
        run: node scripts/i18n-check.mjs

      # `generate_context!` embarque `frontendDist` à la compilation : sans
      # `dist/`, même les tests Rust refusent de compiler.
      - name: Interface
        run: pnpm exec vite build

      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test --lib

      # `cargo test` réécrit les types TypeScript dérivés du Rust (ts-rs). S'ils
      # bougent, c'est qu'un type Rust a changé sans que `src/lib/generated` ne
      # suive : l'interface lirait une forme qui n'existe plus.
      - name: Types dérivés à jour
        run: |
          if [ -n "$(git status --porcelain src/lib/generated)" ]; then
            git status --porcelain src/lib/generated
            git diff src/lib/generated
            echo "::error::src/lib/generated n'est pas à jour : lancer cargo test dans src-tauri et commiter le résultat."
            exit 1
          fi

  # L'interface dans un navigateur, en mode aperçu (données de `src/lib/preview.ts`) :
  # chaque écran s'ouvre sans erreur, et les gestes qui protègent une mission
  # restent visibles. Linux suffit : l'aperçu ne touche à aucun binaire natif.
  interface:
    name: Interface (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Dépendances
        run: pnpm install --frozen-lockfile

      - name: Navigateur
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests d'interface
        run: pnpm test:ui

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Les paquets Linux à essayer, sans rien publier : l'AppImage et le .deb
  # sont construits, puis l'AppImage est lancée sur un écran virtuel. Elle doit
  # encore tourner au bout de 25 secondes, sans panique — ce qui prouve qu'elle
  # trouve ses bibliothèques, ouvre sa fenêtre et charge son interface. À la
  # demande seulement : une compilation de production coûte un quart d'heure.
  paquets-linux:
    name: Paquets Linux (test)
    if: github.event_name == 'workflow_dispatch'
    needs: verifier
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev patchelf xvfb

      - name: Dépendances
        run: pnpm install --frozen-lockfile

      - name: AppImage et .deb
        run: pnpm tauri build --bundles appimage,deb

      - name: L'AppImage démarre
        run: |
          app=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 25 xvfb-run -a "$app" > demarrage.log 2>&1
          code=$?
          set -e
          cat demarrage.log | tail -40
          if grep -q "panicked" demarrage.log; then
            echo "::error::L'AppImage a paniqué au démarrage."
            exit 1
          fi
          # 124 : toujours vivante quand `timeout` l'a arrêtée — c'est le succès.
          if [ "$code" -ne 124 ]; then
            echo "::error::L'AppImage s'est arrêtée d'elle-même (code $code) avant 25 secondes."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cockpit-linux-paquets
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  # Un installeur Windows à essayer, sans rien publier : ni signature de mise à
  # jour, ni release. Sur la branche `windows` et à la demande seulement — une
  # compilation de production coûte une vingtaine de minutes.
  installeur-windows:
    name: Installeur Windows (test)
    if: github.ref == 'refs/heads/windows' || github.event_name == 'workflow_dispatch'
    needs: verifier
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      # OpenSSL se compile avec l'app, et son script de configuration veut un
      # Perl complet : sous Windows, celui de Git Bash n'a pas tous ses modules.
      # Strawberry Perl est installé sur les machines Windows de GitHub. Posée
      # ici et non pour tout le workflow : sur macOS, ce chemin n'existe pas.
      - name: Perl pour OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"

      - name: Dépendances
        run: pnpm install --frozen-lockfile

      - name: Installeur NSIS
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cockpit-windows-installeur
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
