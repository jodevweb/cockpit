# Le contrat du cockpit avec la dernière version publiée de Claude Code.
#
# Le cockpit pilote `claude` par sa ligne de commande : une option renommée ou
# retirée ne se voyait qu'au lancement d'un agent, chez quelqu'un. Chaque nuit,
# on installe la version du jour et on vérifie que tout ce que le cockpit lui
# passe existe encore (`scripts/cli-contract.mjs`). Rien n'est connecté, aucun
# modèle n'est appelé : ça ne coûte rien.
#
# Un échec arrive par la notification habituelle d'un workflow en échec.

name: Contrat Claude Code

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/cli-contract.mjs
      - .github/workflows/contrat-cli.yml

permissions:
  contents: read

jobs:
  contrat:
    name: Contrat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Claude Code, dernière version
        run: npm install -g @anthropic-ai/claude-code

      - name: Contrat
        run: node scripts/cli-contract.mjs
