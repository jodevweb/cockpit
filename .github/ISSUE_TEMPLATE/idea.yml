name: Idea
description: A feature, a change, or something that could work better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what got in the way. Start from the situation rather than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. How you picture it working.
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Optional. The workaround, if there is one.
